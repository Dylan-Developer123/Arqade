<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arqade Chat — Arqade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #12121e; color: #eef; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px; }
  a.exit-game { display: inline-flex; align-items: center; align-self: flex-start; background: #101828; color: #dcefe2; border: 1px solid #3b4b3f; border-radius: 9px; padding: 8px 14px; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none; }
  #room { width: min(680px, 96vw); margin-top: 12px; background: #1e1e30; border: 2px solid #2c2c48; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; height: min(76vh, 720px); }
  #head { padding: 13px 16px 10px; border-bottom: 1px solid #2c2c48; }
  #head h1 { font-size: 22px; }
  #statusLine { font-size: 13.5px; opacity: .8; margin-top: 3px; }
  #memberRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .member { background: #262640; border: 1px solid #3a3a5c; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; }
  .member.me { border-color: #f5c542; color: #ffe9a8; }
  #voiceBar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 10px 16px; background: #101018; border-bottom: 1px solid #2c2c48; }
  #voiceBtn { border-radius: 999px; padding: 9px 15px; font-weight: 800; font-size: 14px; border: 1.5px solid #f5c542; background: #191920; color: #ffe9a8; cursor: pointer; }
  #muteBtn { border-radius: 999px; padding: 9px 13px; font-weight: 800; font-size: 13px; border: 1.5px solid #f5c542; background: #191920; color: #ffe9a8; cursor: pointer; }
  #voiceLine { font-size: 12.5px; color: #a7f3d0; }
  #chatLog { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 14.5px; line-height: 1.55; }
  #chatLog .sys { color: #9aa0b4; font-style: italic; font-size: 13px; }
  #inputRow { display: flex; border-top: 1px solid #2c2c48; }
  #chatInput { flex: 1; min-width: 0; background: #14141f; color: #fff; border: 0; padding: 13px 14px; font-size: 16px; outline: none; }
  #chatSend { background: #f5c542; color: #191920; border: 0; font-weight: 800; font-size: 15px; padding: 0 20px; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #191920; border: 1.5px solid #f5c542; color: #ffe9a8; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 950; }
</style>
</head>
<body>
<a class="exit-game" href="/">← All games</a>
<div id="room">
  <div id="head">
    <h1>💬 Arqade Chat</h1>
    <div id="statusLine">Connecting…</div>
    <div id="memberRow"></div>
  </div>
  <div id="voiceBar">
    <button id="voiceBtn">🎙️ Join voice</button>
    <button id="muteBtn" style="display:none;">🎤 Mic ON</button>
    <span id="voiceLine">🎙️ Nobody in voice yet — tap Join voice</span>
  </div>
  <div id="chatLog"></div>
  <div id="inputRow">
    <input id="chatInput" type="text" maxlength="200" placeholder="Message everyone…" autocomplete="off">
    <button id="chatSend">Send</button>
  </div>
</div>
<div id="toast"></div>
<script>
(function () {
  var ws = null, on = false, myId = null, signedIn = true, retryN = 0, retryT = null;
  var members = {}; // id -> displayName
  var voiceOn = false, voiceMuted = false, localStream = null;
  var voiceSet = new Set(), voicePeers = new Map();
  function $(id) { return document.getElementById(id); }
  var toastT = null;
  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }
  function scrollLog() { var log = $('chatLog'); log.scrollTop = log.scrollHeight; }
  function addLine(name, text, mine) {
    var line = document.createElement('div');
    var nm = document.createElement('b'); nm.textContent = name + ': '; nm.style.color = mine ? '#7dd3fc' : '#f5c542';
    line.appendChild(nm);
    line.appendChild(document.createTextNode(text));
    $('chatLog').appendChild(line);
    while ($('chatLog').children.length > 80) $('chatLog').removeChild($('chatLog').firstChild);
    scrollLog();
  }
  function addSys(text) {
    var line = document.createElement('div');
    line.className = 'sys';
    line.textContent = text;
    $('chatLog').appendChild(line);
    scrollLog();
  }
  function renderMembers() {
    var row = $('memberRow');
    row.innerHTML = '';
    var ids = Object.keys(members);
    if (myId !== null) {
      var me = document.createElement('span');
      me.className = 'member me'; me.textContent = 'You';
      row.appendChild(me);
    }
    ids.forEach(function (id) {
      var chip = document.createElement('span');
      chip.className = 'member';
      chip.textContent = (voiceSet.has(Number(id)) ? '🎙️ ' : '') + members[id];
      row.appendChild(chip);
    });
    $('statusLine').textContent = on ? '🟢 ' + (ids.length + 1) + ' in chat' : 'Connecting…';
  }
  function sendMsg() {
    var inp = $('chatInput');
    var text = inp.value.trim(); if (!text) return;
    if (!on || !ws || ws.readyState !== 1) { showToast('💬 Still connecting… try again in a second'); return; }
    try { ws.send(JSON.stringify({ t: 'chat', text: text.slice(0, 200) })); } catch (e) {}
    inp.value = '';
  }
  function rtcSend(to, data) { if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify({ t: 'rtc', to: to, data: data })); } catch (e) {} } }
  function updateVoiceUi() {
    var vb = $('voiceBtn');
    vb.textContent = voiceOn ? '🎙️ In voice — tap to leave' : '🎙️ Join voice';
    vb.style.background = voiceOn ? '#16a34a' : '#191920';
    vb.style.borderColor = voiceOn ? '#16a34a' : '#f5c542';
    vb.style.color = voiceOn ? '#ffffff' : '#ffe9a8';
    var mb = $('muteBtn');
    mb.style.display = voiceOn ? '' : 'none';
    mb.textContent = voiceMuted ? '🔇 Mic OFF' : '🎤 Mic ON';
    var names = [];
    if (voiceOn) names.push('You');
    voiceSet.forEach(function (id) { if (id !== myId) names.push(members[id] || 'Player'); });
    $('voiceLine').textContent = names.length ? '🎙️ In voice: ' + names.join(' • ') : '🎙️ Nobody in voice yet — tap Join voice';
    renderMembers();
  }
  function peerGone(id) {
    var e = voicePeers.get(id); if (!e) return;
    voicePeers.delete(id);
    try { e.pc.close(); } catch (err) {}
    if (e.audio) { try { e.audio.srcObject = null; e.audio.remove(); } catch (err) {} }
  }
  function makePc(id) {
    var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    var entry = { pc: pc, audio: null, pendingIce: [] };
    voicePeers.set(id, entry);
    if (localStream) localStream.getTracks().forEach(function (tr) { try { pc.addTrack(tr, localStream); } catch (e) {} });
    pc.onicecandidate = function (e) { if (e.candidate) rtcSend(id, { kind: 'ice', candidate: e.candidate }); };
    pc.ontrack = function (e) {
      if (!entry.audio) { var a = new Audio(); a.autoplay = true; entry.audio = a; document.body.appendChild(a); }
      entry.audio.srcObject = e.streams[0];
      entry.audio.play().catch(function () {});
    };
    pc.onconnectionstatechange = function () { if (pc.connectionState === 'failed' || pc.connectionState === 'closed') peerGone(id); };
    return entry;
  }
  function callPeer(id) {
    if (!voiceOn || voicePeers.has(id)) return;
    var entry = makePc(id);
    entry.pc.createOffer().then(function (offer) { return entry.pc.setLocalDescription(offer); }).then(function () {
      rtcSend(id, { kind: 'offer', sdp: entry.pc.localDescription });
    }).catch(function () {});
  }
  async function rtcHandle(from, data) {
    if (!data) return;
    if (data.kind === 'bye') { peerGone(from); return; }
    if (!voiceOn) return;
    try {
      if (data.kind === 'offer') {
        var entry = voicePeers.get(from);
        if (entry && entry.pc.signalingState === 'have-local-offer') {
          if (myId !== null && myId < from) return;
          peerGone(from); entry = null;
        }
        if (!entry) entry = makePc(from);
        await entry.pc.setRemoteDescription(data.sdp);
        for (var i = 0; i < entry.pendingIce.length; i++) { try { await entry.pc.addIceCandidate(entry.pendingIce[i]); } catch (e) {} }
        entry.pendingIce = [];
        var ans = await entry.pc.createAnswer();
        await entry.pc.setLocalDescription(ans);
        rtcSend(from, { kind: 'answer', sdp: entry.pc.localDescription });
      } else if (data.kind === 'answer') {
        var e2 = voicePeers.get(from); if (!e2) return;
        await e2.pc.setRemoteDescription(data.sdp);
        for (var j = 0; j < e2.pendingIce.length; j++) { try { await e2.pc.addIceCandidate(e2.pendingIce[j]); } catch (e) {} }
        e2.pendingIce = [];
      } else if (data.kind === 'ice') {
        var e3 = voicePeers.get(from); if (!e3) return;
        if (e3.pc.remoteDescription) { try { await e3.pc.addIceCandidate(data.candidate); } catch (e) {} }
        else e3.pendingIce.push(data.candidate);
      }
    } catch (e) {}
  }
  function voiceRoster(id, onFlag, name) {
    if (onFlag) {
      voiceSet.add(id);
      if (voiceOn && id !== myId) {
        showToast('🎙️ ' + (name || 'A player') + ' joined voice');
        if (myId !== null && myId < id) setTimeout(function () { if (voiceOn && voiceSet.has(id) && !voicePeers.has(id)) callPeer(id); }, 700);
      }
    } else {
      voiceSet.delete(id);
      if (voiceOn && id !== myId) showToast('🎙️ ' + (name || 'A player') + ' left voice');
      peerGone(id);
    }
    updateVoiceUi();
  }
  async function voiceJoin() {
    if (!on || !ws || ws.readyState !== 1) { showToast('🎙️ Voice connects when chat does — give it a second'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast('🎙️ Voice chat is not supported in this browser'); return; }
    try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { showToast('🎙️ Mic blocked — allow microphone access for this site'); return; }
    if (voiceMuted) localStream.getAudioTracks().forEach(function (t) { t.enabled = false; });
    voiceOn = true;
    try { ws.send(JSON.stringify({ t: 'voice', on: true })); } catch (e) {}
    voiceSet.forEach(function (id) { if (id !== myId) callPeer(id); });
    updateVoiceUi();
    showToast('🎙️ Voice chat ON — players in voice can hear you');
  }
  function voiceLeave(sendState) {
    if (sendState && ws && ws.readyState === 1) { try { ws.send(JSON.stringify({ t: 'voice', on: false })); } catch (e) {} }
    voicePeers.forEach(function (e, id) { rtcSend(id, { kind: 'bye' }); });
    voicePeers.forEach(function (e, id) { peerGone(id); });
    if (localStream) { localStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); localStream = null; }
    voiceOn = false;
    updateVoiceUi();
  }
  function connect() {
    if (ws && ws.readyState < 2) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var sock = new WebSocket(proto + '//' + location.host + '/ws?game=lobby');
    ws = sock;
    sock.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'lwelcome') {
        on = true; retryN = 0; myId = m.id;
        (m.players || []).forEach(function (pl) { members[pl.id] = pl.displayName; if (pl.voice) voiceSet.add(pl.id); });
        addSys('Welcome to Arqade Chat 👋 Say hi!');
        renderMembers(); updateVoiceUi();
      } else if (m.t === 'ljoin') {
        members[m.player.id] = m.player.displayName;
        addSys('🌐 ' + m.player.displayName + ' joined the chat');
        renderMembers();
      } else if (m.t === 'lleave') {
        var nm = members[m.id] || 'A player';
        delete members[m.id];
        peerGone(m.id); voiceSet.delete(m.id);
        addSys('👋 ' + nm + ' left the chat');
        renderMembers(); updateVoiceUi();
      } else if (m.t === 'chat') {
        addLine(m.displayName, m.text, m.id === myId);
      } else if (m.t === 'voice') {
        voiceRoster(m.id, m.on, m.displayName);
      } else if (m.t === 'rtc') {
        rtcHandle(m.from, m.data);
      }
    };
    sock.onclose = function (ev) {
      if (ws === sock) ws = null;
      on = false;
      voiceLeave(false); voiceSet.clear(); members = {};
      renderMembers(); updateVoiceUi();
      if (ev.code === 4001) { signedIn = false; $('statusLine').textContent = '🔒 Sign in on the Arqade home page to chat'; return; }
      if (retryN < 5) {
        var delay = [1500, 4000, 8000, 15000, 30000][retryN] || 30000;
        retryN++;
        clearTimeout(retryT);
        retryT = setTimeout(function () { if (!ws) connect(); }, delay);
      }
    };
    sock.onerror = function () { try { sock.close(); } catch (e) {} };
  }
  $('chatSend').addEventListener('click', sendMsg);
  $('chatInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); sendMsg(); } });
  $('voiceBtn').addEventListener('click', function () { if (voiceOn) { voiceLeave(true); showToast('🎙️ Voice chat OFF'); } else voiceJoin(); });
  $('muteBtn').addEventListener('click', function () {
    voiceMuted = !voiceMuted;
    if (localStream) localStream.getAudioTracks().forEach(function (t) { t.enabled = !voiceMuted; });
    updateVoiceUi();
  });
  document.addEventListener('pointerdown', function () {
    voicePeers.forEach(function (e) { if (e.audio) e.audio.play().catch(function () {}); });
  });
  updateVoiceUi();
  connect();
})();
</script>
<script src="/games/admin-panel.js"></script>
</body>
</html>
