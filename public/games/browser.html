<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Web Browser — Arqade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #12121e; color: #eef; display: flex; flex-direction: column; min-height: 100vh; padding: 12px; }
  a.exit-game { display: inline-flex; align-items: center; align-self: flex-start; background: #101828; color: #dcefe2; border: 1px solid #3b4b3f; border-radius: 9px; padding: 8px 14px; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none; }
  #app { width: min(980px, 98vw); margin: 12px auto 0; flex: 1; display: flex; flex-direction: column; background: #1e1e30; border: 2px solid #2c2c48; border-radius: 16px; overflow: hidden; }
  #bar { display: flex; align-items: center; gap: 7px; padding: 10px 12px; background: #101018; border-bottom: 1px solid #2c2c48; flex-wrap: wrap; }
  .navbtn { background: #262640; color: #eef; border: 1px solid #3a3a5c; border-radius: 9px; font-size: 16px; font-weight: 800; padding: 8px 12px; cursor: pointer; line-height: 1; }
  .navbtn:active { background: #32325a; }
  #addr { flex: 1; min-width: 140px; background: #14141f; color: #fff; border: 1.5px solid #3a3a5c; border-radius: 999px; padding: 9px 16px; font-size: 15px; outline: none; }
  #addr:focus { border-color: #f5c542; }
  #goBtn { background: #f5c542; color: #191920; border: 0; border-radius: 999px; font-weight: 800; font-size: 14.5px; padding: 9px 18px; cursor: pointer; }
  #openBtn { background: #262640; color: #ffe9a8; border: 1.5px solid #f5c542; border-radius: 999px; font-weight: 800; font-size: 14.5px; padding: 8px 14px; cursor: pointer; }
  #note { padding: 7px 14px; font-size: 12.5px; color: #9aa0b4; background: #171722; border-bottom: 1px solid #2c2c48; }
  #stage { flex: 1; position: relative; min-height: 52vh; background: #fff; }
  #view { width: 100%; height: 100%; border: 0; position: absolute; inset: 0; background: #fff; display: none; z-index: 1; }
  #home { position: absolute; inset: 0; background: #12121e; overflow-y: auto; padding: 20px 18px 24px; z-index: 2; }
  #home h1 { font-size: 24px; margin-bottom: 4px; }
  #home p { font-size: 14px; opacity: .75; margin-bottom: 16px; }
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .link { background: #262640; border: 2px solid #3a3a5c; border-radius: 14px; padding: 16px 10px 13px; text-align: center; cursor: pointer; color: #eef; }
  .link:hover { border-color: #f5c542; }
  .link .emo { font-size: 36px; display: block; margin-bottom: 7px; }
  .link .nm { font-weight: 800; font-size: 14.5px; }
  .link .ds { font-size: 11.5px; opacity: .65; margin-top: 2px; }
</style>
</head>
<body>
<a class="exit-game" href="/">← All games</a>
<div id="app">
  <div id="bar">
    <button class="navbtn" id="homeBtn" title="Browser home">🏠</button>
    <button class="navbtn" id="backBtn" title="Back">⟨</button>
    <button class="navbtn" id="fwdBtn" title="Forward">⟩</button>
    <button class="navbtn" id="reloadBtn" title="Reload">⟳</button>
    <input id="addr" type="text" placeholder="Type a website or search…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="goBtn">Go</button>
    <button id="openBtn" title="Open this page in a new tab">Open ↗</button>
  </div>
  <div id="note">💡 If a page stays blank, that site blocks being opened inside Arqade — tap <b>Open ↗</b> to visit it directly.</div>
  <div id="stage">
    <div id="home">
      <h1>🌐 Web Browser</h1>
      <p>Browse the web without leaving Arqade. Type an address above, search, or tap a shortcut:</p>
      <div class="links" id="links"></div>
    </div>
    <iframe id="view" title="Web Browser" allowfullscreen></iframe>
  </div>
</div>
<script>
(function () {
  var view = document.getElementById('view');
  var home = document.getElementById('home');
  var addr = document.getElementById('addr');
  var current = '';
  var LINKS = [
    { emo: '🔍', nm: 'Google', ds: 'Google Search', url: 'https://www.google.com/search?igu=1' },
    { emo: '🔎', nm: 'Web Search', ds: 'Marginalia Search', url: 'https://marginalia-search.com/' },
    { emo: '📖', nm: 'Wikipedia', ds: 'The free encyclopedia', url: 'https://en.wikipedia.org' },
    { emo: '🗺️', nm: 'World Map', ds: 'OpenStreetMap', url: 'https://www.openstreetmap.org/export/embed.html' },
    { emo: '📚', nm: 'Internet Archive', ds: 'Books, games & more', url: 'https://archive.org' },
    { emo: '🧮', nm: 'Cool Math Games', ds: 'Games & puzzles', url: 'https://www.coolmathgames.com' },
    { emo: '📚', nm: 'Open Library', ds: 'Every book ever', url: 'https://openlibrary.org' }
  ];
  var linksEl = document.getElementById('links');
  LINKS.forEach(function (l) {
    var d = document.createElement('div');
    d.className = 'link';
    var e = document.createElement('span'); e.className = 'emo'; e.textContent = l.emo;
    var n = document.createElement('div'); n.className = 'nm'; n.textContent = l.nm;
    var s = document.createElement('div'); s.className = 'ds'; s.textContent = l.ds;
    d.appendChild(e); d.appendChild(n); d.appendChild(s);
    d.addEventListener('click', function () { go(l.url); });
    linksEl.appendChild(d);
  });
  function toUrl(text) {
    text = (text || '').trim();
    if (!text) return '';
    if (/^https?:\/\//i.test(text)) return text;
    if (text.indexOf(' ') >= 0 || text.indexOf('.') < 0) {
      return 'https://marginalia-search.com/search?query=' + encodeURIComponent(text);
    }
    return 'https://' + text;
  }
  function go(url) {
    if (!url) return;
    current = url;
    addr.value = url;
    home.style.display = 'none';
    view.style.display = 'block';
    view.src = url;
  }
  document.getElementById('homeBtn').addEventListener('click', function () {
    home.style.display = '';
    view.style.display = 'none';
  });
  function goFromAddr() { go(toUrl(addr.value)); }
  document.getElementById('goBtn').addEventListener('click', goFromAddr);
  addr.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); goFromAddr(); } });
  document.getElementById('backBtn').addEventListener('click', function () {
    if (!current) return;
    try { view.contentWindow.history.back(); } catch (e) {}
  });
  document.getElementById('fwdBtn').addEventListener('click', function () {
    if (!current) return;
    try { view.contentWindow.history.forward(); } catch (e) {}
  });
  document.getElementById('reloadBtn').addEventListener('click', function () {
    if (!current) { home.style.display = ''; view.style.display = 'none'; return; }
    var u = current;
    view.src = 'about:blank';
    setTimeout(function () { view.src = u; }, 60);
  });
  document.getElementById('openBtn').addEventListener('click', function () {
    if (current) window.open(current, '_blank');
  });
})();
</script>
<script src="/games/admin-panel.js"></script>
</body>
</html>
