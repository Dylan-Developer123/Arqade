<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meteor AI — Arqade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #12121e; color: #eef; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px; }
  a.exit-game { display: inline-flex; align-items: center; align-self: flex-start; background: #101828; color: #dcefe2; border: 1px solid #3b4b3f; border-radius: 9px; padding: 8px 14px; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none; }
  #aiBox { width: min(680px, 96vw); margin-top: 12px; background: #1e1e30; border: 2px solid #2c2c48; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; height: min(78vh, 740px); }
  #head { padding: 13px 16px 11px; border-bottom: 1px solid #2c2c48; display: flex; align-items: center; gap: 12px; }
  #avatar { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 9px rgba(249,115,22,.65)); }
  #head h1 { font-size: 21px; }
  #head h1 .ver { color: #f5c542; }
  #statusLine { font-size: 13px; opacity: .8; margin-top: 2px; }
  #statusLine .dot { color: #4ade80; }
  #modeBar { margin-left: auto; display: flex; gap: 7px; }
  .modeBtn { border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 13.5px; border: 1.5px solid #3a3a5c; background: #191920; color: #cfcfe8; cursor: pointer; font-family: inherit; }
  .modeBtn.on { border-color: #f5c542; color: #ffe9a8; background: #2e2a1a; }
  #modeBar .hidden { display: none; }
  #chatLog { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.bot { background: #262640; border: 1px solid #3a3a5c; align-self: flex-start; border-bottom-left-radius: 5px; }
  .msg.me { background: #155e80; align-self: flex-end; border-bottom-right-radius: 5px; }
  .msg .who { display: block; font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; opacity: .65; margin-bottom: 3px; }
  .msg pre { background: #0d0d16; border: 1px solid #3a3a5c; border-radius: 9px; padding: 10px 12px; margin-top: 8px; font-size: 12.5px; line-height: 1.45; overflow-x: auto; white-space: pre; color: #d9f99d; }
  .copyBtn { margin-top: 7px; background: #f5c542; color: #191920; border: 0; border-radius: 8px; font-weight: 800; font-size: 12.5px; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  .pushBtn { margin-top: 7px; margin-left: 7px; background: #f97316; color: #fff; border: 0; border-radius: 8px; font-weight: 800; font-size: 12.5px; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  .pushBtn:disabled { opacity: .55; cursor: default; }
  .sendBtn { background: #7c3aed; color: #fff; border: 0; border-radius: 8px; font-weight: 800; font-size: 12.5px; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  .sendBtn.armed { background: #5b21b6; }
  .sendBtn:disabled { opacity: .55; cursor: default; }
  .typing { align-self: flex-start; font-size: 13px; color: #9aa0b4; font-style: italic; padding: 2px 4px; }
  #chips { display: flex; gap: 7px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid #2c2c48; background: #171726; }
  .chip { background: #262640; border: 1.5px solid #3a3a5c; color: #eef; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .chip:active { border-color: #f5c542; }
  #inputRow { display: flex; border-top: 1px solid #2c2c48; }
  #chatInput { flex: 1; min-width: 0; background: #14141f; color: #fff; border: 0; padding: 13px 14px; font-size: 16px; outline: none; font-family: inherit; }
  #chatSend { background: #f5c542; color: #191920; border: 0; font-weight: 800; font-size: 15px; padding: 0 20px; cursor: pointer; font-family: inherit; }
  .pvBtn { margin-top: 7px; margin-left: 7px; background: #262640; color: #eef; border: 1.5px solid #3a3a5c; border-radius: 8px; font-weight: 800; font-size: 12.5px; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  #previewModal { display: none; position: fixed; inset: 0; background: rgba(6,6,12,.78); z-index: 60; align-items: center; justify-content: center; padding: 14px; }
  #previewModal.open { display: flex; }
  .pvCard { background: #1e1e30; border: 2px solid #3a3a5c; border-radius: 16px; width: min(860px, 97vw); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
  .pvHead { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #2c2c48; font-weight: 800; font-size: 15px; }
  .pvHead button { margin-left: auto; background: #262640; color: #eef; border: 1.5px solid #3a3a5c; border-radius: 8px; font-weight: 800; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  #pvFrame { width: 100%; height: 62vh; border: 0; background: #fff; }
</style>
</head>
<body>
<a class="exit-game" href="/">← All games</a>

<div id="aiBox">
  <div id="head">
    <div id="avatar">☄️</div>
    <div>
      <h1>Meteor <span class="ver">1.2</span></h1>
      <div id="statusLine"><span class="dot">●</span> Online · Arqade's AI, by Meteor</div>
    </div>
    <div id="modeBar">
      <button class="modeBtn on" id="modeChat">💬 Chat</button>
      <button class="modeBtn hidden" id="modeCode">💻 Code</button>
    </div>
  </div>
  <div id="chatLog"></div>
  <div id="chips"></div>
  <div id="inputRow">
    <input id="chatInput" type="text" placeholder="Ask Meteor anything…" maxlength="500" autocomplete="off">
    <button id="chatSend">Send</button>
  </div>
</div>

<div id="previewModal">
  <div class="pvCard">
    <div class="pvHead"><span id="pvTitle">Preview</span><button id="pvClose">✖ Close</button></div>
    <iframe id="pvFrame" sandbox="allow-scripts"></iframe>
  </div>
</div>

<script src="/games/admin-panel.js"></script>
<script>
(function () {
  var log = document.getElementById('chatLog');
  var input = document.getElementById('chatInput');
  var chipsBox = document.getElementById('chips');
  var modeChatBtn = document.getElementById('modeChat');
  var modeCodeBtn = document.getElementById('modeCode');
  var mode = 'chat';
  var isOwner = false;
  var canCode = false;
  var canPublish = false;
  var pushAvailable = false;
  var myName = 'friend';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function armButton(btn, label, armedLabel, fn) {
    var armed = false, timer = null;
    btn.addEventListener('click', function () {
      if (!armed) {
        armed = true;
        btn.textContent = armedLabel;
        timer = setTimeout(function () { armed = false; btn.textContent = label; }, 3500);
        return;
      }
      clearTimeout(timer);
      fn();
    });
  }

  function addMsg(cls, who, text, code, pushSlug) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    var html = '<span class="who">' + esc(who) + '</span>' + esc(text);
    if (code) {
      html += '<pre>' + esc(code) + '</pre><button class="copyBtn">📋 Copy code</button>';
      if (pushSlug) {
        html += '<button class="pvBtn">👁 Preview</button>';
        if (canPublish && pushAvailable) html += '<button class="pushBtn">🚀 Push to site</button>';
        if (!canPublish) html += '<button class="sendBtn">📨 Send to Dylan</button>';
      }
    }
    d.innerHTML = html;
    if (code) {
      d.querySelector('.copyBtn').addEventListener('click', function () {
        var btn = this;
        function done() { btn.textContent = '✅ Copied!'; setTimeout(function () { btn.textContent = '📋 Copy code'; }, 1600); }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
        else done();
      });
      var pvBtn = d.querySelector('.pvBtn');
      if (pvBtn) pvBtn.addEventListener('click', function () { openPreview('👁 Preview — /games/' + pushSlug, code); });
      var pushBtn = d.querySelector('.pushBtn');
      if (pushBtn) {
        armButton(pushBtn, '🚀 Push to site', 'Tap again to publish 🚀', function () {
          pushBtn.disabled = true;
          pushBtn.textContent = '🚀 Publishing…';
          fetch('/api/meteor/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slug: pushSlug, code: code })
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
          }).then(function (res) {
            if (res.ok) {
              pushBtn.textContent = '✅ Published!';
              botSay('Done! 🚀 Your page is on GitHub (commit ' + (res.j.commit || '—') + '). Render is rebuilding now — it\'ll be live at ' + res.j.url + ' in about a minute. It\'s not on the portal yet: ask Baxter to add the card, or grab the "portal card" code from me and paste it in.', null, 400);
            } else {
              pushBtn.disabled = false;
              pushBtn.textContent = '🚀 Push to site';
              botSay('⚠️ Publish failed: ' + (res.j.error || 'something went wrong.'), null, 300);
            }
          }).catch(function () {
            pushBtn.disabled = false;
            pushBtn.textContent = '🚀 Push to site';
            botSay('⚠️ Publish failed: no connection. Try again in a bit.', null, 300);
          });
        });
      }
      var sendBtn = d.querySelector('.sendBtn');
      if (sendBtn && pushSlug) {
        armButton(sendBtn, '📨 Send to Dylan', 'Tap again to send 📨', function () {
          sendBtn.disabled = true;
          sendBtn.textContent = '📨 Sending…';
          fetch('/api/meteor/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: pushSlug, code: code }) }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
          }).then(function (res) {
            if (res.ok) {
              sendBtn.textContent = '✅ Sent!';
              botSay('📨 Sent to Dylan! He\'ll preview "/games/' + pushSlug + '" in the Feedback app\'s 🛠 Dev requests tab — ✅ and it goes live, ❌ and it doesn\'t. Your status shows in that tab too.', null, 300);
            } else {
              sendBtn.disabled = false;
              sendBtn.textContent = '📨 Send to Dylan';
              botSay('⚠️ Couldn\'t send: ' + (res.j.error || 'try again in a bit.'), null, 300);
            }
          }).catch(function () {
            sendBtn.disabled = false;
            sendBtn.textContent = '📨 Send to Dylan';
            botSay('⚠️ Send failed: no connection. Try again in a bit.', null, 300);
          });
        });
      }
    }
    log.appendChild(d);
    scrollDown();
  }

  /* ---------------- live preview ---------------- */
  var pvModal = document.getElementById('previewModal');
  var pvFrame = document.getElementById('pvFrame');
  var pvTitle = document.getElementById('pvTitle');

  function stripForPreview(code) {
    return code.replace(/<script[^>]*src="\/games\/admin-panel\.js"[^>]*><\/script>/g, '<!-- preview: site scripts off -->');
  }
  function openPreview(title, code) {
    pvTitle.textContent = title;
    pvFrame.srcdoc = stripForPreview(code);
    pvModal.classList.add('open');
  }
  function closePreview() { pvModal.classList.remove('open'); pvFrame.srcdoc = ''; }
  document.getElementById('pvClose').addEventListener('click', closePreview);

  function botSay(text, code, delay, pushSlug) {
    var t = document.createElement('div');
    t.className = 'typing';
    t.textContent = '☄️ Meteor is typing…';
    log.appendChild(t); scrollDown();
    setTimeout(function () {
      t.remove();
      addMsg('bot', 'Meteor 1.2', text, code, pushSlug);
    }, delay || (450 + Math.random() * 550));
  }

  /* ---------------- the brain ---------------- */
  var GAMES = [
    ['Mining Simulator', 'Dig through 100 stages, collect coins and gems, buy enchants, and mine together in the shared multiplayer world.'],
    ['City Pursuit 3D', 'An open-city driving game — outrun the cops, jack cars, and explore in Explore, Multiplayer or Pursuit mode.'],
    ['Turbo Racer 3D', 'One endless 3D highway — desert, green fields and ocean coast. Thread the traffic and build near-miss combos.'],
    ['Arqade Chat', 'Text and voice chat with everyone on Arqade, with player-made servers.'],
    ['Web Browser', 'Browse the web without leaving Arqade, with a built-in YouTube player.'],
    ['Settings', 'Every setting for every game in one place.'],
    ['Snake', 'Eat the apples, grow longer, don\'t bite yourself.'],
    ['Breakout', 'Smash every brick with the ball and paddle.'],
    ['Flappy Bird', 'Tap to flap through the pipes.'],
    ['Memory Match', 'Flip the cards and find every pair.'],
    ['2048', 'Slide the tiles and reach 2048.'],
    ['Coin Clicker', 'Click the coin, get rich, buy upgrades.'],
    ['Clicker Simulator', 'Click the big coin, buy click power and auto earners, then rebirth — your multiplier doubles every time and ✨ tokens buy permanent upgrades.'],
    ['Pong', 'The original — beat the paddle on the other side.'],
    ['Minesweeper', 'Clear the board without hitting a mine.'],
    ['Space Invaders', 'Blast the invaders before they land.'],
    ['Lunar Lander', 'Land the module gently on the moon.'],
    ['Word Guess', 'Guess the word before you run out of tries.']
  ];
  var JOKES = [
    'Why did the meteor go to school? To get brighter! ☄️',
    'What do you call a fake noodle? An impasta! 🍝',
    'Why don\'t scientists trust atoms? Because they make up everything! ⚛️',
    'What did the ocean say to the beach? Nothing — it just waved! 🌊',
    'Why did the scarecrow win an award? Because he was outstanding in his field! 🌾',
    'What do you call a bear with no teeth? A gummy bear! 🐻',
    'Why did the computer go to the doctor? It had a virus! 💻',
    'What\'s a meteor\'s favorite game? Crash-tronauts! (Okay, I made that one up on impact.)'
  ];
  var jokeIdx = 0, fallbackIdx = 0, rpsActive = false;
  var FALLBACKS = [
    'Hmm, that one\'s beyond my 1.2 brain for now. Try asking me for a joke, a game pick, or some math — and in Code mode I can even BUILD games!',
    'I\'m still learning! Ask me "what games are on Arqade", "tell me a joke", or give me a math problem.',
    'Good question — that\'s one for a future version of me. Meanwhile: want a game recommendation?'
  ];

  function findGame(q) {
    for (var i = 0; i < GAMES.length; i++) if (q.indexOf(GAMES[i][0].toLowerCase()) >= 0) return GAMES[i];
    if (q.indexOf('mining') >= 0 || q.indexOf('miner') >= 0) return GAMES[0];
    if (q.indexOf('pursuit') >= 0 || q.indexOf('cop') >= 0 || q.indexOf('city') >= 0) return GAMES[1];
    if (q.indexOf('racer') >= 0 || q.indexOf('racing') >= 0) return GAMES[2];
    return null;
  }

  /* safe little math parser: + - * / ^ % ( ) decimals */
  function calc(expr) {
    var s = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/,/g, '');
    if (!/^[\d\s+\-*/^%().]+$/.test(s)) return null;
    if (!/\d\s*[-+*/^%]\s*\(?\s*\d/.test(s) && !/\(\s*\d/.test(s)) return null;
    var pos = 0;
    function peek() { return s[pos]; }
    function parseNum() {
      var m = /^\d*\.?\d+/.exec(s.slice(pos));
      if (!m) return NaN;
      pos += m[0].length;
      return parseFloat(m[0]);
    }
    function parsePrimary() {
      while (s[pos] === ' ') pos++;
      if (s[pos] === '(') { pos++; var v = parseExpr(); while (s[pos] === ' ') pos++; if (s[pos] === ')') pos++; return v; }
      if (s[pos] === '-') { pos++; return -parsePrimary(); }
      return parseNum();
    }
    function parsePow() {
      var b = parsePrimary();
      while (true) { while (s[pos] === ' ') pos++; if (s[pos] === '^') { pos++; b = Math.pow(b, parsePrimary()); } else return b; }
    }
    function parseTerm() {
      var v = parsePow();
      while (true) {
        while (s[pos] === ' ') pos++;
        if (s[pos] === '*') { pos++; v = v * parsePow(); }
        else if (s[pos] === '/') { pos++; v = v / parsePow(); }
        else if (s[pos] === '%') { pos++; v = v % parsePow(); }
        else return v;
      }
    }
    function parseExpr() {
      var v = parseTerm();
      while (true) {
        while (s[pos] === ' ') pos++;
        if (s[pos] === '+') { pos++; v = v + parseTerm(); }
        else if (s[pos] === '-') { pos++; v = v - parseTerm(); }
        else return v;
      }
    }
    var out = parseExpr();
    while (s[pos] === ' ') pos++;
    if (pos < s.length || typeof out !== 'number' || !isFinite(out)) return null;
    return Math.round(out * 1e10) / 1e10;
  }

  /* ---------------- 1.2 daily-use helpers ---------------- */
  var triviaOn = false, triviaIdx = 0, triviaScore = 0, triviaOrder = [];
  var TRIVIA = [
    { q: 'How many legs does a spider have?', a: '8', ok: ['8', 'eight'] },
    { q: 'What planet is known as the Red Planet?', a: 'Mars', ok: ['mars'] },
    { q: 'How many sides does a hexagon have?', a: '6', ok: ['6', 'six'] },
    { q: 'What is 9 × 6?', a: '54', ok: ['54'] },
    { q: 'Which ocean is the biggest on Earth?', a: 'The Pacific Ocean', ok: ['pacific'] },
    { q: 'How many minutes are in 3 hours?', a: '180', ok: ['180'] },
    { q: 'What gas do plants breathe in?', a: 'Carbon dioxide (CO₂)', ok: ['carbon dioxide', 'co2'] },
    { q: 'On Arqade, which game has wanted stars and police chases?', a: 'City Pursuit 3D', ok: ['city pursuit', 'pursuit'] }
  ];
  var meteorTimers = [];
  function startTimer(ms, label) {
    var id = setTimeout(function () {
      botSay('⏰ Timer done! ' + label + ' — time\'s up!', null, 0);
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { var ac = new AC(); var o = ac.createOscillator(); var g = ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.value = 0.07; o.start(); setTimeout(function () { o.stop(); ac.close(); }, 700); }
      } catch (e) {}
    }, ms);
    meteorTimers.push(id);
  }
  function loadList(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
  function saveList(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} }
  function fmtNum(n) {
    if (!isFinite(n)) return '∞';
    var r = Math.round(n * 10000) / 10000;
    return String(r);
  }
  var UNIT_DEFS = [
    { names: ['miles', 'mile', 'mi'], base: 1609.34, group: 'len', label: 'miles' },
    { names: ['kilometers', 'kilometer', 'km'], base: 1000, group: 'len', label: 'km' },
    { names: ['meters', 'meter', 'm'], base: 1, group: 'len', label: 'meters' },
    { names: ['feet', 'foot', 'ft'], base: 0.3048, group: 'len', label: 'feet' },
    { names: ['inches', 'inch', 'in'], base: 0.0254, group: 'len', label: 'inches' },
    { names: ['yards', 'yard', 'yd'], base: 0.9144, group: 'len', label: 'yards' },
    { names: ['kilograms', 'kilogram', 'kg'], base: 1, group: 'wt', label: 'kg' },
    { names: ['pounds', 'pound', 'lbs', 'lb'], base: 0.453592, group: 'wt', label: 'pounds' },
    { names: ['ounces', 'ounce', 'oz'], base: 0.0283495, group: 'wt', label: 'ounces' },
    { names: ['grams', 'gram', 'g'], base: 0.001, group: 'wt', label: 'grams' },
    { names: ['liters', 'liter', 'l'], base: 1, group: 'vol', label: 'liters' },
    { names: ['milliliters', 'milliliter', 'ml'], base: 0.001, group: 'vol', label: 'ml' },
    { names: ['gallons', 'gallon', 'gal'], base: 3.78541, group: 'vol', label: 'gallons' },
    { names: ['cups', 'cup'], base: 0.236588, group: 'vol', label: 'cups' },
    { names: ['hours', 'hour', 'hrs', 'hr', 'h'], base: 3600, group: 'time', label: 'hours' },
    { names: ['minutes', 'minute', 'mins', 'min'], base: 60, group: 'time', label: 'minutes' },
    { names: ['seconds', 'second', 'secs', 'sec'], base: 1, group: 'time', label: 'seconds' },
    { names: ['days', 'day'], base: 86400, group: 'time', label: 'days' },
    { names: ['weeks', 'week'], base: 604800, group: 'time', label: 'weeks' }
  ];
  function findUnit(word) {
    word = word.toLowerCase().replace(/°/g, '');
    for (var i = 0; i < UNIT_DEFS.length; i++) if (UNIT_DEFS[i].names.indexOf(word) >= 0) return UNIT_DEFS[i];
    return null;
  }
  function convertQuery(raw) {
    var q = raw.toLowerCase();
    var m = q.match(/(-?\d+(?:\.\d+)?)\s*(fahrenheit|celsius|kelvin|°f|°c|f|c)\s+(?:to|in)\s+(fahrenheit|celsius|kelvin|°f|°c|f|c)\b/);
    if (m) {
      var v = parseFloat(m[1]);
      var from = m[2].replace('°', ''), to = m[3].replace('°', '');
      var c = from === 'f' ? (v - 32) * 5 / 9 : from === 'kelvin' ? v - 273.15 : v;
      var out = to === 'f' ? c * 9 / 5 + 32 : to === 'kelvin' ? c + 273.15 : c;
      var nm = { f: '°F', c: '°C', kelvin: 'K' };
      return '🌡️ ' + v + nm[from] + ' = ' + fmtNum(out) + nm[to];
    }
    m = q.match(/(-?\d+(?:\.\d+)?)\s*([a-z]+)\s+(?:to|in|=)\s*([a-z]+)\b/);
    if (m) {
      var a = findUnit(m[2]), b = findUnit(m[3]);
      if (a && b && a.group === b.group) return '🔁 ' + m[1] + ' ' + a.label + ' = ' + fmtNum(parseFloat(m[1]) * a.base / b.base) + ' ' + b.label;
      if (a && b) return '🤔 Those measure different things (' + a.group + ' vs ' + b.group + ') — can\'t convert those.';
    }
    return null;
  }
  var MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function nextDate(month, day) {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var d = new Date(now.getFullYear(), month, day);
    if (d < now) d = new Date(now.getFullYear() + 1, month, day);
    return d;
  }
  function daysUntilQuery(q) {
    var m = q.match(/days until ([a-z]+)\s+(\d{1,2})/) || q.match(/days until (\d{1,2})\s+([a-z]+)/);
    var target = null, label = '';
    if (m) {

    if (kind === 'footer') return '<footer style="text-align:center;padding:22px 14px;opacity:.75;font-size:14px;border-top:1px solid #2c2c48;margin-top:30px;">\n  Made with ☄️ on Arqade · <a href="#" style="color:#f5c542;">Home</a> · <a href="#" style="color:#f5c542;">Games</a>\n</footer>';
    if (kind === 'gallery') return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;">\n  <div style="height:90px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-size:34px;">🌅</div>\n  <div style="height:90px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-size:34px;">🌊</div>\n  <div style="height:90px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#14532d);display:flex;align-items:center;justify-content:center;font-size:34px;">🌲</div>\n  <div style="height:90px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;font-size:34px;">🎆</div>\n  <div style="height:90px;border-radius:12px;background:linear-gradient(135deg,#facc15,#f97316);display:flex;align-items:center;justify-content:center;font-size:34px;">🏖️</div>\n  <div style="height:90px;border-radius:12px;background:linear-gradient(135deg,#334155,#0f172a);display:flex;align-items:center;justify-content:center;font-size:34px;">🌙</div>\n</div>';
    if (kind === 'accordion') return '<div style="max-width:420px;">\n  <details style="background:#1e1e30;border:1.5px solid #2c2c48;border-radius:10px;padding:12px 15px;margin-bottom:8px;">\n    <summary style="font-weight:800;cursor:pointer;">❓ Question one</summary>\n    <p style="opacity:.85;">The answer goes here.</p>\n  </details>\n  <details style="background:#1e1e30;border:1.5px solid #2c2c48;border-radius:10px;padding:12px 15px;margin-bottom:8px;">\n    <summary style="font-weight:800;cursor:pointer;">❓ Question two</summary>\n    <p style="opacity:.85;">Another answer goes here.</p>\n  </details>\n</div>';
    if (kind === 'carousel') return '<div style="display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px;max-width:460px;">\n  <div style="min-width:200px;height:120px;scroll-snap-align:center;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-size:40px;">🌅</div>\n  <div style="min-width:200px;height:120px;scroll-snap-align:center;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-size:40px;">🌊</div>\n  <div style="min-width:200px;height:120px;scroll-snap-align:center;border-radius:14px;background:linear-gradient(135deg,#22c55e,#14532d);display:flex;align-items:center;justify-content:center;font-size:40px;">🌲</div>\n</div>\n<p style="opacity:.7;font-size:13px;">← Swipe or scroll →</p>';
    if (kind === 'darkmode') return '<button onclick="document.body.classList.toggle(\'dark\')" style="background:#262640;color:#eef;border:1.5px solid #3a3a5c;border-radius:999px;font-weight:800;padding:10px 20px;cursor:pointer;">🌙 Toggle dark mode</button>\n<style>\n  body { transition: background .3s, color .3s; }\n  body.dark { background: #0b0b14; color: #eef; }\n</style>';
    if (kind === 'tabs') return '<div>\n  <button onclick="showTab1(this, \'p1\')" style="background:#f5c542;color:#191920;border:0;border-radius:9px 9px 0 0;font-weight:800;padding:9px 18px;cursor:pointer;">Tab One</button>\n  <button onclick="showTab1(this, \'p2\')" style="background:#262640;color:#eef;border:0;border-radius:9px 9px 0 0;font-weight:800;padding:9px 18px;cursor:pointer;">Tab Two</button>\n  <div id="p1" style="background:#1e1e30;border:2px solid #2c2c48;border-radius:0 12px 12px 12px;padding:16px;">First tab content.</div>\n  <div id="p2" style="display:none;background:#1e1e30;border:2px solid #2c2c48;border-radius:0 12px 12px 12px;padding:16px;">Second tab content.</div>\n</div>\n<script>\n  function showTab1(btn, id) {\n    document.getElementById(\'p1\').style.display = id === \'p1\' ? \'block\' : \'none\';\n    document.getElementById(\'p2\').style.display = id === \'p2\' ? \'block\' : \'none\';\n  }\n<\/script>';
    return '';
  }

  function explainCode(code) {
    var lines = code.split('\n');
    var out = ['📖 That\'s ' + lines.length + ' lines of code. Here\'s what it does:'];
    var fns = code.match(/function\s+([A-Za-z_$][\w$]*)/g);
    if (fns) out.push('• It defines ' + fns.length + ' function' + (fns.length > 1 ? 's' : '') + ' (' + fns.map(function (f) { return f.replace('function ', '') + '()'; }).slice(0, 6).join(', ') + ') — reusable jobs the code can run.');
    var listeners = (code.match(/addEventListener/g) || []).length;
    if (listeners) out.push('• It listens for ' + listeners + ' event' + (listeners > 1 ? 's' : '') + ' (addEventListener) — that\'s how it reacts to clicks, keys and touches.');
    var loops = (code.match(/\b(for|while)\s*\(/g) || []).length;
    if (loops) out.push('• It has ' + loops + ' loop' + (loops > 1 ? 's' : '') + ' — repeating jobs, like checking every brick or card.');
    var ifs = (code.match(/\bif\s*\(/g) || []).length;
    if (ifs) out.push('• It makes ' + ifs + ' decision' + (ifs > 1 ? 's' : '') + ' with if-statements — scores, collisions, wins and losses.');
    if (/<canvas/i.test(code)) out.push('• It draws on a <canvas> — that\'s the game screen.');
    if (/localStorage/.test(code)) out.push('• It uses localStorage — saving data in the browser between visits.');
    if (/fetch\(/.test(code)) out.push('• It uses fetch() — talking to a server or API over the internet.');
    if (/setInterval|requestAnimationFrame/.test(code)) out.push('• It runs on a timer/animation loop — that\'s what makes things move.');
    if (/<style/i.test(code) || /style=/.test(code)) out.push('• It includes styling — colors, sizes and layout.');
    if (out.length === 1) out.push('• Mostly structure and content — no big logic jumps out. Paste a game script and I\'ll dig deeper.');
    out.push('Want a bug hunt too? Say "check" and paste it again.');
    return out.join('\n');
  }

  function lintCode(code) {
    var issues = [];
    function bal(open, close, name) { var a = code.split(open).length - 1, b = code.split(close).length - 1; if (a !== b) issues.push(name + ': ' + a + ' opening vs ' + b + ' closing'); return b - a; }
    var missBrace = bal('{', '}', 'Braces { }');
    bal('(', ')', 'Parentheses ( )');
    bal('[', ']', 'Brackets [ ]');
    var isPage = /<!DOCTYPE html>/i.test(code) || /<html/i.test(code);
    if (isPage && !/<\/html>/i.test(code)) issues.push('Missing the closing </html> tag');
    if (isPage && !/<\/body>/i.test(code)) issues.push('Missing the closing </body> tag');
    var so = (code.match(/<script/g) || []).length, sc2 = (code.match(/<\/script>/g) || []).length;
    if (so !== sc2) issues.push('Script tags: ' + so + ' opening vs ' + sc2 + ' closing');
    if (!issues.length) return { text: '✅ I checked it — braces, brackets and tags all balance, and the structure looks complete. No obvious breakage found!' };
    var fixed = code;
    if (missBrace < 0) { for (var i = 0; i < -missBrace; i++) fixed += '\n}'; }
    if (isPage && !/<\/body>/i.test(fixed)) fixed += '\n</body>';
    if (isPage && !/<\/html>/i.test(fixed)) fixed += '\n</html>';
    var changed = fixed !== code;
    return { text: '🔍 Found ' + issues.length + ' thing' + (issues.length > 1 ? 's' : '') + ' to look at:\n• ' + issues.join('\n• ') + (changed ? '\nHere\'s a version with the missing closers added — the rest is yours to review:' : ''), code: changed ? fixed : undefined };
  }

  var UTIL_SNIPPETS = {
    countdown: '<div style="font-size:44px;font-weight:800;" id="cd">10</div>\n<script>\n  var n = 10;\n  var iv = setInterval(function () {\n    n--;\n    document.getElementById(\'cd\').textContent = n > 0 ? n : \'⏰ Time up!\';\n    if (n <= 0) clearInterval(iv);\n  }, 1000);\n<\/script>',
    stopwatch: '<div style="font-size:44px;font-weight:800;" id="sw">0.0</div>\n<button onclick="startSw()">▶ Start</button> <button onclick="stopSw()">⏸ Stop</button> <button onclick="resetSw()">↻ Reset</button>\n<script>\n  var t = 0, iv = null;\n  function drawSw() { document.getElementById(\'sw\').textContent = (t / 10).toFixed(1); }\n  function startSw() { if (!iv) iv = setInterval(function () { t++; drawSw(); }, 100); }\n  function stopSw() { clearInterval(iv); iv = null; }\n  function resetSw() { stopSw(); t = 0; drawSw(); }\n<\/script>',
    password: '<script>\n  function makePassword(len) {\n    var chars = \'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%\';\n    var out = \'\';\n    for (var i = 0; i < (len || 12); i++) out += chars[Math.floor(Math.random() * chars.length)];\n    return out;\n  }\n  // try it: alert(makePassword(12));\n<\/script>',
    tip: '<input type="number" id="bill" placeholder="Bill $" style="padding:10px;"> <input type="number" id="pct" placeholder="Tip %" value="18" style="padding:10px;width:80px;">\n<button onclick="tipCalc()">Calculate</button>\n<p id="tipOut" style="font-weight:800;"></p>\n<script>\n  function tipCalc() {\n    var b = parseFloat(document.getElementById(\'bill\').value) || 0;\n    var p = parseFloat(document.getElementById(\'pct\').value) || 0;\n    var tip = b * p / 100;\n    document.getElementById(\'tipOut\').textContent = \'Tip: $\' + tip.toFixed(2) + \' · Total: $\' + (b + tip).toFixed(2);\n  }\n<\/script>'
  };

  var CODE_HELP = '💻 Code mode 1.2 — I build REAL working code:\n• 🎮 FULL playable games (10 now!): snake, breakout, flappy, pong, clicker, reaction, memory, guessing, quiz, dice — try "make a breakout game" or "game page called Gem Clicker with a clicker game" (name a gem/cookie/star and the clicker uses it!)\n• 🏗 Page builder: "build a page with a navbar and a hero and a footer" — I assemble the pieces into one page\n• 🧩 Page pieces: navbar, hero, button ("make a gold button saying Play"), card, form, table, modal, gallery, accordion, carousel, tabs, dark mode toggle, footer\n• 🔍 "explain" + paste code — I walk through what it does\n• 🛠 "check" + paste code — I hunt for unbalanced braces and missing tags, and fix the easy ones\n• Utilities: "countdown code", "stopwatch code", "password generator code", "tip calculator code"\n• "portal card for Rocket Jump" · "gradient #ff0000 to #0000ff" · "encode hello world" · "count the words in this text"\nEvery game page gets a 👁 Preview so you can play it right here. The owner publishes with 🚀 Push; developer-tag players tap 📨 Send to Dylan — he previews it in the 💌 Feedback app Dev requests tab and taps ✅ or ❌.\nFor one-of-a-kind custom features, Baxter in your Muse chat still codes those live — I build from my 1.2 patterns.';

  function codeReply(raw) {
    var q = raw.toLowerCase();
    var m;
    if (q.indexOf('help') >= 0 || q.trim() === '') return { text: CODE_HELP };
    if (/^explain/i.test(raw.trim())) {
      var ec = raw.replace(/^explain\s*(this\s*)?(code)?[:\s]*/i, '');
      if (ec.length < 15) return { text: 'Paste the code right after the word "explain" and I\'ll walk through what it does, piece by piece. 📖' };
      return { text: explainCode(ec) };
    }
    if (/^(check|fix|debug)/i.test(raw.trim())) {
      var fc = raw.replace(/^(check|fix|debug)\s*(this\s*)?(code)?[:\s]*/i, '');
      if (fc.length < 15) return { text: 'Paste the code after the word "check" and I\'ll hunt for unbalanced braces, unclosed tags and missing pieces. 🔍' };
      return lintCode(fc);
    }
    if ((m = raw.match(/game page (?:called|for)\s+(.+)/i))) {
      var gname = m[1].trim();
      var gtype = detectGameType(gname);
      gname = gname.replace(/\s+with\s+(an?\s+|the\s+)?(snake|breakout|flappy|pong|clicker|reaction|memory|guessing|guess|quiz|trivia|dice)(\s+game)?\s*$/i, '').trim() || m[1].trim();
      var gslug = slugify(gname);
      if (gtype) return { text: 'Here\'s "' + gname + '" with a FULL playable ' + GAME_TYPES[gtype].label + ' game inside — the real game, not a blank page.' + codeTail(), code: playablePage(gname, gtype, raw), slug: gslug };
      return { text: 'Here\'s a starter page for "' + gname + '" — Arqade style, with the account gate built in.' + codeTail(), code: gameSkeleton(gname), slug: gslug };
    }
    if ((m = raw.match(/(?:make|build|create|code)\s+(?:me\s+)?(?:an?\s+)?(?:\w+\s+)?(snake|breakout|flappy|pong|clicker|reaction|memory|guessing|guess|quiz|trivia|dice)(?:\s+game)?(?:\s+called\s+(.+))?/i))) {
      var mtype = detectGameType(m[1]);
      var mname = (m[2] || (GAME_TYPES[mtype].label + ' Game')).trim();
      return { text: 'One FULL playable ' + GAME_TYPES[mtype].label + ' game, coming up — the page is called "' + mname + '".' + codeTail(), code: playablePage(mname, mtype, raw), slug: slugify(mname) };
    }
    if ((m = raw.match(/^(?:a\s+|an\s+)?(?:\w+\s+)?(snake|breakout|flappy|pong|clicker|reaction|memory|guessing|guess|quiz|trivia|dice)(?:\s+game)?\b/i))) {
      var btype = detectGameType(m[1]);
      var bname = GAME_TYPES[btype].label + ' Game';
      return { text: 'One FULL playable ' + GAME_TYPES[btype].label + ' game, coming up — the page is called "' + bname + '".' + codeTail(), code: playablePage(bname, btype, raw), slug: slugify(bname) };
    }
    if ((m = raw.match(/(?:portal )?card (?:for|called)\s+(.+)/i))) return { text: 'Here\'s the portal card for "' + m[1].trim() + '":', code: cardSnippet(m[1].trim()) };
    var bk = [];
    [['navbar', /nav\s?bar/], ['hero', /hero/], ['gallery', /gallery/], ['card', /\bcard\b/], ['table', /table/], ['form', /form/], ['modal', /modal/], ['accordion', /accordion/], ['footer', /footer/]].forEach(function (kd) { if (kd[1].test(q)) bk.push(kd[0]); });
    if (bk.length >= 2 && /(page|site|website)/.test(q)) {
      var nm2 = raw.match(/called\s+(.+)/i);
      var pname = nm2 ? nm2[1].trim() : 'My Page';
      var border = ['navbar', 'hero', 'gallery', 'card', 'table', 'form', 'accordion', 'modal', 'footer'];
      var bparts = border.filter(function (k) { return bk.indexOf(k) >= 0; }).map(function (k) { return snippet(k, raw); });
      return { text: 'Built you a whole page with ' + bparts.length + ' pieces (' + bk.join(' + ') + ') — all on one Arqade page.' + codeTail(), code: pageShell(pname, bparts.join('\n'), '// Page built with Meteor 1.2 page builder — pieces: ' + bk.join(', ')), slug: slugify(pname) };
    }
    if ((m = raw.match(/(?:make|add|create|build|code)\s+(?:me\s+)?(?:an?\s+)?(?:\w+\s+)?(nav\s?bar|hero|button|card|form|table|modal|footer|gallery|accordion|carousel|tabs|dark\s?mode)\b/i))) {
      var kind = m[1].toLowerCase().replace(/\s+/g, '');
      if (kind === 'navbar') kind = 'navbar';
      return { text: 'Here\'s your ' + m[1].toLowerCase() + ' — paste it into any page:', code: snippet(kind === 'nav' ? 'navbar' : kind, raw) };
    }
    if ((m = q.match(/(countdown|stopwatch|password generator|tip calculator)/))) {
      var ukey = m[1] === 'password generator' ? 'password' : (m[1] === 'tip calculator' ? 'tip' : m[1]);
      return { text: 'Here\'s a working ' + m[1] + ' — paste it into a page and it just runs:', code: UTIL_SNIPPETS[ukey] };
    }
    if ((m = raw.match(/gradient\s+(#[0-9a-f]{3,8})\s+(?:to\s+)?(#[0-9a-f]{3,8})/i))) return { text: 'Gradient, ready to paste:', code: 'background: linear-gradient(135deg, ' + m[1] + ', ' + m[2] + ');' };
    if ((m = raw.match(/^encode\s+([\s\S]+)/i))) { try { return { text: 'Encoded:', code: btoa(unescape(encodeURIComponent(m[1]))) }; } catch (e) { return { text: 'I couldn\'t encode that one.' }; } }
    if ((m = raw.match(/^decode\s+([\s\S]+)/i))) { try { return { text: 'Decoded:', code: decodeURIComponent(escape(atob(m[1].trim()))) }; } catch (e) { return { text: 'That doesn\'t look like valid Base64.' }; } }
    if (q.indexOf('count') >= 0) {
      var body = raw.replace(/^count( the)?( words)?( in)?( this text)?[:\s]*/i, '');
      var words = body.trim() ? body.trim().split(/\s+/).length : 0;
      return { text: '📊 Characters: ' + body.length + ' · Words: ' + words + ' · Lines: ' + (body ? body.split('\n').length : 0) };
    }
    return { text: 'That build is beyond my 1.2 patterns — but they\'re BIG now: 10 full playable games, a page builder, page pieces, code explaining and bug-checking, utilities, portal cards, gradients, Base64 and counts. For one-of-a-kind custom features, ask Baxter in your Muse chat and he\'ll code and ship it live, like always. Want the list? Say "help".' };
  }

  /* ---------------- wiring ---------------- */
  var CHAT_CHIPS = ['Weather today 🌦️', 'Set a timer for 1 minute ⏰', 'Quiz me 🧠', 'Tell me a joke 😂', 'Pick a game for me 🎮', 'Days until christmas 📅'];
  var CODE_CHIPS = ['Help', 'Make a breakout game', 'Game page called Gem Clicker with a clicker game', 'Build a page with a navbar and a hero', 'Make a flappy game', 'Make a snake game'];

  function renderChips() {
    chipsBox.innerHTML = '';
    (mode === 'code' ? CODE_CHIPS : CHAT_CHIPS).forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = c;
      b.addEventListener('click', function () { send(c.replace(/\s*[^\x00-\x7F]+\s*$/u, '').trim() || c); });
      chipsBox.appendChild(b);
    });
  }

  function setMode(next) {
    if (next === 'code' && !canCode) return;
    mode = next;
    modeChatBtn.classList.toggle('on', mode === 'chat');
    modeCodeBtn.classList.toggle('on', mode === 'code');
    input.placeholder = mode === 'code' ? 'Tell Meteor what to code…' : 'Ask Meteor anything…';
    renderChips();
    if (mode === 'code') botSay(CODE_HELP);
  }
  modeChatBtn.addEventListener('click', function () { setMode('chat'); });
  modeCodeBtn.addEventListener('click', function () { setMode('code'); });

  function send(text) {
    var raw = (typeof text === 'string' ? text : input.value).trim();
    if (!raw) return;
    input.value = '';
    addMsg('me', myName, raw);
    if (mode === 'code') {
      var r = codeReply(raw);
      botSay(r.text, r.code, 600, r.slug);
    } else if (/\bweather\b/i.test(raw)) {
      botSay('🌦️ Checking the sky…', null, 350);
      setTimeout(function () { weatherReply(raw); }, 700);
    } else {
      botSay(chatReply(raw));
    }
  }
  document.getElementById('chatSend').addEventListener('click', function () { send(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

  renderChips();
  botSay('Hey! I\'m Meteor 1.2 ☄️ — Arqade\'s AI. Ask me anything, or tap one of the ideas below.', null, 300);

  fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.user) {
      if (d.user.displayName) myName = d.user.displayName;
      if (d.user.isOwner) isOwner = true;
      fetch('/api/meteor/access').then(function (r) { return r.ok ? r.json() : null; }).then(function (a) {
        if (a && a.code) {
          canCode = true;
          canPublish = !!a.canPublish;
          pushAvailable = !!a.pushAvailable;
          modeCodeBtn.classList.remove('hidden');
        }
      }).catch(function () {});
    }
  }).catch(function () {});
})();
</script>
